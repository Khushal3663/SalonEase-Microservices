services:

  mysqldb:
    image: mysql:8.0
    ports:
      - "3310:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysqldata:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - khushal

  rabbitmq:
    image: rabbitmq:4.2-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 512m
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["NONE"]
    networks:
      - khushal

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 1200m
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - khushal

  eurekaserver:
    image: "khushal36/salon-eurekaserver:v1"
    ports:
      - "8070:8070"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8070/actuator/health/readiness | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - khushal

  user:
    image: "khushal36/salon-user:v1"
    ports:
      - "5001:5001"
    depends_on:
      mysqldb:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5001/actuator/health/readiness | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    environment:
      SPRING_APPLICATION_NAME: "user-service"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysqldb:3306/userdb_salon"
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8070/eureka/
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - khushal

  booking:
    image: "khushal36/salon-booking:v1"
    ports:
      - "5005:5005"
    depends_on:
      mysqldb:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5005/actuator/health/readiness | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    environment:
      SPRING_APPLICATION_NAME: "booking-service"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysqldb:3306/bookingdb_salon"
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8070/eureka/
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - khushal

  category:
    image: "khushal36/salon-category:v1"
    ports:
      - "5003:5003"
    depends_on:
      mysqldb:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5003/actuator/health/readiness | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    environment:
      SPRING_APPLICATION_NAME: "category-service"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysqldb:3306/categorydb_salon"
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8070/eureka/
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - khushal

  payment:
    image: "khushal36/salon-payment:v1"
    ports:
      - "5006:5006"
    depends_on:
      mysqldb:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5006/actuator/health/readiness | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    environment:
      SPRING_APPLICATION_NAME: "payment-service"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysqldb:3306/paymentdb_salon"
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      RAZORPAY_API_KEY: ${RAZORPAY_API_KEY}
      RAZORPAY_API_SECRET: ${RAZORPAY_API_SECRET}
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8070/eureka/
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - khushal

  salon:
    image: "khushal36/salon-service:v1"
    ports:
      - "5002:5002"
    depends_on:
      mysqldb:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5002/actuator/health/readiness | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    environment:
      SPRING_APPLICATION_NAME: "salon-service"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysqldb:3306/salondb_salon"
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8070/eureka/
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - khushal

  service-offering:
    image: "khushal36/salon-service-offering:v1"
    ports:
      - "5004:5004"
    depends_on:
      mysqldb:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5004/actuator/health/readiness | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    environment:
      SPRING_APPLICATION_NAME: "service-offering"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysqldb:3306/servicesdb_salon"
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8070/eureka/
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - khushal

  notification:
    image: "khushal36/salon-notification:v1"
    ports:
      - "5007:5007"
    depends_on:
      mysqldb:
        condition: service_healthy
      rabbitmq:
        condition: service_started # Fixed from service_healthy to match the disabled status above
      eurekaserver:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "notification-service"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysqldb:3306/notificationdb_salon"
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: ${RABBITMQ_PORT}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8070/eureka/
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - khushal

  review:
    image: "khushal36/salon-review:v1"
    ports:
      - "5008:5008"
    depends_on:
      mysqldb:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "review-service"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysqldb:3306/reviewdb_salon"
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8070/eureka/
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - khushal

  gatewayserver:
    image: "khushal36/salon-gatewayserver:v1"
    ports:
      - "5000:5000"
    depends_on:
      eurekaserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/actuator/health/readiness | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      SPRING_APPLICATION_NAME: "gateway-server"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8070/eureka/
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL}
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - khushal

  salon-ui:
    image: "khushal36/salon-ui:v1"
    ports:
      - "3000:3000"
    build:
      context: ./frontend
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    depends_on:
      gatewayserver:
        condition: service_healthy
    networks:
      - khushal

networks:
  khushal:
    driver: "bridge"

volumes:
  mysqldata:
  rabbitmq_data:
  keycloak_data: