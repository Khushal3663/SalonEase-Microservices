server:
  port: 5000

spring:
  application:
    name: gateway-server

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
          routes:
            - id: BOOKING-SERVICE
              uri: lb://BOOKING-SERVICE
              predicates:
                - Path=/api/bookings/**

            - id: PAYMENT-SERVICE
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/api/payments/**

            - id: CATEGORY-SERVICE
              uri: lb://CATEGORY-SERVICE
              predicates:
                - Path=/api/categories/**

            - id: SALON-SERVICE
              uri: lb://SALON-SERVICE
              predicates:
                - Path=/salons/**,/api/salons/**,/api/admin/salons/**

            - id: USER-SERVICE
              uri: lb://USER-SERVICE
              predicates:
                - Path=/auth/**,/api/users/**,/users/**

            - id: SERVICE-OFFERING
              uri: lb://SERVICE-OFFERING
              predicates:
                - Path=/api/service-offering/**

            - id: NOTIFICATION-SERVICE
              uri: lb:ws://NOTIFICATION-SERVICE
              predicates:
                - Path=/api/notifications/**

            - id: REVIEW-SERVICE
              uri: lb://REVIEW-SERVICE
              predicates:
                - Path=/api/reviews/**

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URL:http://localhost:8080/realms/myrealm}

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8070/eureka/}

